[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "hmm-stock-market-prediction"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "streamlit==1.32.0",
    "yfinance==0.2.37",
    "numpy==1.24.4",
    "pandas==1.5.3",
    "hmmlearn==0.3.3",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]
